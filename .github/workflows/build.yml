name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon

      - name: zipalign + sign APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] || { echo "APK not found"; exit 1; }
          echo "Build APK:"; ls -la "$APK"
          mkdir -p artifact

          # --- Get zipalign (AGP 8.5 doesn't ship it on ubuntu-latest) ---
          ZALIGN="$(command -v zipalign 2>/dev/null || true)"
          BT_VER="34.0.0"
          if [ -z "$ZALIGN" ]; then
            echo "Downloading build-tools for zipalign..."
            if curl -fsSL "https://dl.google.com/android/repository/android-${BT_VER}_build-tools_r34-linux.zip" -o /tmp/bt.zip; then
              unzip -qo /tmp/bt.zip -d /tmp
              ZALIGN="/tmp/${BT_VER}/zipalign"
            else
              echo "BT direct download 404 — cmdline-tools fallback..."
              curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o /tmp/clt.zip
              unzip -qo /tmp/clt.zip -d /tmp
              echo "y" | /tmp/cmdline-tools/bin/sdkmanager --sdk_root=/tmp/sdk "build-tools;${BT_VER}" >/dev/null 2>&1 || true
              ZALIGN="/tmp/sdk/build-tools/${BT_VER}/zipalign"
            fi
            [ -f "$ZALIGN" ] || { echo "zipalign not found"; exit 1; }
            echo "Got: $ZALIGN"
          fi

          # --- zipalign (destroys AGP v2 signature; we resign after with standard debug keystore) ---
          "$ZALIGN" -p -v 4 "$APK" artifact/app-aligned.apk
          echo "Aligned:"; ls -la artifact/app-aligned.apk

          # --- Sign with standard debug keystore via apksigner (v2 + v3, never breaks alignment) ---
          keytool -genkeypair -noprompt \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore artifact/debug.keystore \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          apksigner sign \
            --ks artifact/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out artifact/app-debug.apk \
            artifact/app-aligned.apk
          echo "Signed with apksigner (v2+v3)."

          # --- Verify ---
          echo "--- apksigner verify ---"
          apksigner verify --verbose artifact/app-debug.apk
          echo "--- zipalign verify ---"
          "$ZALIGN" -c -p 4 artifact/app-debug.apk && echo "zipalign OK"

          rm -f artifact/app-aligned.apk
          echo "Final APK:"; ls -la artifact/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kiomet-browser
          path: artifact/app-debug.apk
